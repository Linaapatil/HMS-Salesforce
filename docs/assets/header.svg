<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="MedCare Hospital Management System">
  <title>MedCare Hospital Management System</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B0B3A">
        <animate attributeName="stop-color" values="#1B0B3A;#2A0F55;#1B0B3A" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#4A1689">
        <animate attributeName="stop-color" values="#4A1689;#621BA5;#4A1689" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#9B2BC8">
        <animate attributeName="stop-color" values="#9B2BC8;#C934D6;#9B2BC8" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0"/>
      <stop offset="35%" stop-color="#5EEAD4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F0ABFC" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F0ABFC" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F0ABFC" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      .title { font: 700 46px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #FFFFFF; letter-spacing: -0.5px; }
      .eyebrow { font: 600 14px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #5EEAD4; letter-spacing: 4px; }
      .subtitle { font: 400 19px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #E9D5FF; }
      .chip { font: 600 13px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #FFFFFF; }
      .fade1 { opacity: 0; animation: rise 0.9s ease-out 0.2s forwards; }
      .fade2 { opacity: 0; animation: rise 0.9s ease-out 0.5s forwards; }
      .fade3 { opacity: 0; animation: rise 0.9s ease-out 0.8s forwards; }
      .fade4 { opacity: 0; animation: rise 0.9s ease-out 1.1s forwards; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      .ecg { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 3.2s cubic-bezier(.6,.05,.3,1) infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 1400; } 70% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -1400; } }
      .beat { transform-origin: 1010px 150px; animation: beat 1.6s ease-in-out infinite; }
      @keyframes beat { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.12); } 24% { transform: scale(0.98); } 36% { transform: scale(1.07); } }
      .orb { animation: float 7s ease-in-out infinite; }
      .orb2 { animation: float 9s ease-in-out infinite reverse; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    </style>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>

  <circle class="orb" cx="1080" cy="70" r="110" fill="url(#glow)"/>
  <circle class="orb2" cx="160" cy="300" r="140" fill="url(#glow)" opacity="0.5"/>

  <!-- heartbeat line -->
  <path class="ecg" d="M0 305 H620 L640 305 L652 288 L664 322 L678 270 L694 334 L706 305 L740 305 L752 297 L764 305 H980 L996 305 L1008 290 L1020 320 L1034 274 L1048 332 L1060 305 H1200"
        fill="none" stroke="url(#pulse)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ecg" d="M0 305 H620 L640 305 L652 288 L664 322 L678 270 L694 334 L706 305 L740 305 L752 297 L764 305 H980 L996 305 L1008 290 L1020 320 L1034 274 L1048 332 L1060 305 H1200"
        fill="none" stroke="#F0ABFC" stroke-opacity="0.5" stroke-width="8" filter="url(#soft)"/>

  <!-- medical cross emblem -->
  <g class="beat">
    <rect x="950" y="90" width="120" height="120" rx="30" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <path d="M995 112h30v23h23v30h-23v23h-30v-23h-23v-30h23z" fill="#FFFFFF"/>
  </g>

  <text x="64" y="92" class="eyebrow fade1">SALESFORCE  ·  HEALTHCARE CRM</text>
  <text x="64" y="148" class="title fade2">MedCare Hospital Management System</text>
  <text x="64" y="186" class="subtitle fade3">Patients, doctors, appointments, billing and medical records on one platform.</text>

  <g class="fade4">
    <rect x="64" y="212" width="94" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.14"/>
    <text x="111" y="232" class="chip" text-anchor="middle">Apex</text>
    <rect x="168" y="212" width="74" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.14"/>
    <text x="205" y="232" class="chip" text-anchor="middle">LWC</text>
    <rect x="252" y="212" width="80" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.14"/>
    <text x="292" y="232" class="chip" text-anchor="middle">Flows</text>
    <rect x="342" y="212" width="118" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.14"/>
    <text x="401" y="232" class="chip" text-anchor="middle">REST / SOAP</text>
    <rect x="470" y="212" width="128" height="30" rx="15" fill="#5EEAD4" fill-opacity="0.22"/>
    <text x="534" y="232" class="chip" text-anchor="middle">97% coverage</text>
  </g>
</svg>
