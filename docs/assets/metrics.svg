<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="Project metrics: 75 of 75 Apex tests passing, 97 percent coverage, 24 of 24 Jest tests, 7 flows">
  <title>Project metrics</title>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <style>
      .card { fill: #FFFFFF; stroke: #E4E1F0; }
      .label { font: 600 12px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #6B6489; letter-spacing: 1.6px; }
      .value { font: 700 40px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #1E1537; }
      .unit { font: 600 18px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #8B85A8; }
      .note { font: 400 13px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #6B6489; }
      .c1 { opacity: 0; animation: up 0.7s ease-out 0.1s forwards; }
      .c2 { opacity: 0; animation: up 0.7s ease-out 0.35s forwards; }
      .c3 { opacity: 0; animation: up 0.7s ease-out 0.6s forwards; }
      .c4 { opacity: 0; animation: up 0.7s ease-out 0.85s forwards; }
      @keyframes up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
      .fill1 { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.4s cubic-bezier(.2,.8,.2,1) 0.5s forwards; }
      .fill2 { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.4s cubic-bezier(.2,.8,.2,1) 0.75s forwards; }
      .fill3 { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.4s cubic-bezier(.2,.8,.2,1) 1s forwards; }
      .fill4 { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.4s cubic-bezier(.2,.8,.2,1) 1.25s forwards; }
      @keyframes grow { to { transform: scaleX(1); } }
      .dot { animation: blink 2s ease-in-out infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    </style>
  </defs>

  <g class="c1">
    <rect class="card" x="6" y="10" width="282" height="170" rx="14"/>
    <circle class="dot" cx="34" cy="42" r="5" fill="#10B981"/>
    <text x="48" y="47" class="label">APEX TESTS</text>
    <text x="28" y="108" class="value">75<tspan class="unit"> / 75 passing</tspan></text>
    <rect x="28" y="130" width="236" height="8" rx="4" fill="#EEEAF7"/>
    <rect class="fill1" x="28" y="130" width="236" height="8" rx="4" fill="url(#bar)"/>
    <text x="28" y="162" class="note">15 test classes, bulk + negative cases</text>
  </g>

  <g class="c2">
    <rect class="card" x="310" y="10" width="282" height="170" rx="14"/>
    <circle class="dot" cx="338" cy="42" r="5" fill="#10B981"/>
    <text x="352" y="47" class="label">ORG COVERAGE</text>
    <text x="332" y="108" class="value">97<tspan class="unit"> %</tspan></text>
    <rect x="332" y="130" width="236" height="8" rx="4" fill="#EEEAF7"/>
    <rect class="fill2" x="332" y="130" width="229" height="8" rx="4" fill="url(#bar)"/>
    <line x1="532" y1="124" x2="532" y2="144" stroke="#1E1537" stroke-dasharray="2 2"/>
    <text x="332" y="162" class="note">Required: 85% (marker)</text>
  </g>

  <g class="c3">
    <rect class="card" x="614" y="10" width="282" height="170" rx="14"/>
    <circle class="dot" cx="642" cy="42" r="5" fill="#10B981"/>
    <text x="656" y="47" class="label">LWC JEST</text>
    <text x="636" y="108" class="value">24<tspan class="unit"> / 24 passing</tspan></text>
    <rect x="636" y="130" width="236" height="8" rx="4" fill="#EEEAF7"/>
    <rect class="fill3" x="636" y="130" width="236" height="8" rx="4" fill="url(#bar)"/>
    <text x="636" y="162" class="note">94% statement coverage, ESLint clean</text>
  </g>

  <g class="c4">
    <rect class="card" x="918" y="10" width="276" height="170" rx="14"/>
    <circle class="dot" cx="946" cy="42" r="5" fill="#7C3AED"/>
    <text x="960" y="47" class="label">AUTOMATION</text>
    <text x="940" y="108" class="value">7<tspan class="unit"> flows + approval</tspan></text>
    <rect x="940" y="130" width="230" height="8" rx="4" fill="#EEEAF7"/>
    <rect class="fill4" x="940" y="130" width="230" height="8" rx="4" fill="url(#bar)"/>
    <text x="940" y="162" class="note">Record-triggered, scheduled, screen</text>
  </g>
</svg>
